[pytest]
pythonpath = .
testpaths = tests
# The slowest test in the suite is under 2 s (docs/qa/TEST-SPEED.md). 120 s stopped guarding
# anything once /manuals and /cost were taking 100 s each; 30 s is still 15x the slowest test
# and a minute of cold imports, and makes a test that goes back to reading the corpus per call
# fail rather than merely annoy.
timeout = 30
filterwarnings =
    ignore::DeprecationWarning
