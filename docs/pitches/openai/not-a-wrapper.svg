<path d="M268,311L272.167,311C276.333,311,284.667,311,292.333,311C300,311,307,311,310.5,311L314,311" id="my-svg-L_A_B_0" class="edge-thickness-thick edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_A_B_0" data-points="W3sieCI6MjY4LCJ5IjozMTF9LHsieCI6MjkzLCJ5IjozMTF9LHsieCI6MzE4LCJ5IjozMTF9XQ==" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/><path d="M578,311L582.167,311C586.333,311,594.667,311,602.333,311C610,311,617,311,620.5,311L624,311" id="my-svg-L_B_C_0" class="edge-thickness-thick edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_B_C_0" data-points="W3sieCI6NTc4LCJ5IjozMTF9LHsieCI6NjAzLCJ5IjozMTF9LHsieCI6NjI4LCJ5IjozMTF9XQ==" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/><path d="M888,311L892.167,311C896.333,311,904.667,311,912.333,311C920,311,927,311,930.5,311L934,311" id="my-svg-L_C_D_0" class="edge-thickness-thick edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style=";" data-edge="true" data-et="edge" data-id="L_C_D_0" data-points="W3sieCI6ODg4LCJ5IjozMTF9LHsieCI6OTEzLCJ5IjozMTF9LHsieCI6OTM4LCJ5IjozMTF9XQ==" data-look="classic" marker-end="url(#my-svg_flowchart-v2-pointEnd)"/></g><g class="edgeLabels"><g class="edgeLabel"><g class="label" data-id="L_A_B_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_B_C_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_C_D_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default det" id="my-svg-flowchart-A-0" data-look="classic" transform="translate(138, 311)"><rect class="basic label-container" style="fill:#eef2f7 !important;stroke:#475569 !important;stroke-width:3px !important" x="-130" y="-303" width="260" height="606"/><g class="label" style="color:#0f172a !important" transform="translate(-100, -288)"><rect/><foreignObject width="200" height="576"><div style="color: rgb(15, 23, 42) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#0f172a !important" class="nodeLabel"><p><b>1 · DETERMINISTIC</b><br /><i>no model, no tokens,<br />no chance of being wrong</i><br /><br />• PDF text layer + per-block<br />  coordinates (PyMuPDF)<br />• BM25 over the manual's own<br />  printed headings<br />• SPEC PATH: a torque question<br />  answers from parsed rows —<br />  <b>0 LLM calls, $0.00013</b><br />• PARTS CATALOG: 295 taxonomy<br />  entries matched to the manual's<br />  own words — <b>0 LLM calls</b><br />• answer cache · currency maths ·<br />  URL liveness · highlight geometry</p></span></div></foreignObject></g></g><g class="node default ai" id="my-svg-flowchart-B-1" data-look="classic" transform="translate(448, 311)"><rect class="basic label-container" style="fill:#e85d04 !important;stroke:#5c2200 !important;stroke-width:4px !important" x="-130" y="-243" width="260" height="486"/><g class="label" style="color:#ffffff !important" transform="translate(-100, -228)"><rect/><foreignObject width="200" height="456"><div style="color: rgb(255, 255, 255) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#ffffff !important" class="nodeLabel"><p><b>2 · THE MODEL ONLY EVER<br />DECIDES THREE THINGS</b><br /><br />• <b>WHICH VEHICLE</b> is in this photo<br />  — and only from our catalog<br /><br />• <b>WHICH PAGE IDs</b> answer this<br />  sentence — it returns ids,<br />  never a word of prose<br /><br />• <b>HOW TO SAY</b> what those pages<br />  already print — chat, the one<br />  place words are generated</p></span></div></foreignObject></g></g><g class="node default guard" id="my-svg-flowchart-C-2" data-look="classic" transform="translate(758, 311)"><rect class="basic label-container" style="fill:#d1fae5 !important;stroke:#047857 !important;stroke-width:3px !important" x="-130" y="-303" width="260" height="606"/><g class="label" style="color:#053e2c !important" transform="translate(-100, -288)"><rect/><foreignObject width="200" height="576"><div style="color: rgb(5, 62, 44) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#053e2c !important" class="nodeLabel"><p><b>3 · VERIFIED IN CODE BEFORE<br />ANYTHING IS SHOWN</b><br /><br />• every ingest quote must be found<br />  in the PDF text layer, or dropped<br />• every picked id must be in the<br />  candidate list, or dropped<br />• every citation quote is sliced by<br />  the SERVER out of the original<br />  page — verbatim by construction,<br />  not by trusting the model<br />• every number must be printed on a<br />  page the model was given<br />• every offer URL is fetched<br />  before it ships</p></span></div></foreignObject></g></g><g class="node default out" id="my-svg-flowchart-D-3" data-look="classic" transform="translate(1068, 311)"><rect class="basic label-container" style="fill:#141414 !important;stroke:#e85d04 !important;stroke-width:4px !important" x="-130" y="-207" width="260" height="414"/><g class="label" style="color:#ffffff !important" transform="translate(-100, -192)"><rect/><foreignObject width="200" height="384"><div style="color: rgb(255, 255, 255) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#ffffff !important" class="nodeLabel"><p><b>WHAT THE MECHANIC SEES</b><br /><br />the manufacturer's own page,<br />with the lines marked.<br /><br /><b>Never AI prose presented<br />as the answer.</b><br /><br />Measured: 100% top-1 over<br />150 queries · 100% valid citations<br />0 invented numbers · 0 dealer referrals<br /><b>$0.00038 per ask · $0.10 per manual</b></p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><text text-anchor="middle" x="603" y="-25" class="flowchartTitleText">Not a wrapper — what is deterministic, what the model decides, what is verified</text></svg>