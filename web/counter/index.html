<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e85d04">
  <title>Mechanica</title>
  <meta name="ttm-api" content="/api">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.ico?v=4" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=4">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;800&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/counter.css">
  <link rel="stylesheet" href="css/particons.css">
  <link rel="stylesheet" href="css/viewer3d.css">
  <link rel="stylesheet" href="css/screens/identify.css">
  <link rel="stylesheet" href="css/screens/confirm.css">
  <link rel="stylesheet" href="css/screens/pick.css">
  <link rel="stylesheet" href="css/screens/book.css">
  <link rel="stylesheet" href="css/screens/invoice.css">
  <link rel="stylesheet" href="css/screens/cost.css">
  <link rel="stylesheet" href="css/climate.css">
</head>
<body>
  <header class="ticket">
    <button type="button" class="ticket-back is-off" data-back aria-label="Back">←</button>
    <span>MECHANICA</span>
  </header>
  <ol class="rail">
    <li data-step="identify" class="now" aria-current="step"><b>1</b><span>Identify</span></li>
    <li data-step="confirm"><b>2</b><span>Confirm</span></li>
    <li data-step="pick"><b>3</b><span>Pick</span></li>
    <li data-step="book"><b>4</b><span>Book</span></li>
  </ol>
  <main>
    <section data-screen="identify" hidden><div data-root></div></section>
    <section data-screen="confirm" hidden><div data-root></div></section>
    <section data-screen="pick" hidden><div data-root></div></section>
    <section data-screen="book" hidden><div data-root></div></section>
  </main>
  <aside class="ov pv" data-overlay="invoice" hidden>
    <div class="ov-sheet pv-sheet" role="dialog" aria-modal="true" aria-label="Parts" data-root></div>
  </aside>
  <script type="module" src="js/app.js"></script>
</body>
</html>
