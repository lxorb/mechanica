<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e85d04">
  <title>Mechanica</title>
  <meta name="ttm-api" content="/api">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.ico?v=5" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=5">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=5">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png?v=5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Non-blocking. As a plain stylesheet this third party sat on the critical path of an
       app whose every other byte is local: measured with fonts.googleapis.com hanging, the
       first paint went from 0.3 s to 12.1 s — a blank screen in a garage with bad wifi.
       The faces already carry display=swap, so a cold load was already a FOUT; this only
       decides whether the app is on screen while it waits. -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;800&family=Big+Shoulders+Display:wght@700;800&display=swap">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;800&family=Big+Shoulders+Display:wght@700;800&display=swap">
  </noscript>
  <!-- The roster is what the search field is waiting for, and it used to be requested two round
       trips after this file: html -> app.js -> ttm.js -> fetch. Preloading it starts the download
       with the HTML. No crossorigin and no Accept: ttm.js fetches it with no header of its own, so
       the preload and the fetch are one request. The photo index next to it is deliberately not
       preloaded - nothing on the first screen needs it. -->
  <link rel="preload" href="../store/ttm-catalog.json" as="fetch">
  <!-- The module graph behind the search field, flattened from four serial round trips into one.
       The other four screens are not here on purpose: app.js loads them once Identify is up. -->
  <link rel="modulepreload" href="js/bus.js">
  <link rel="modulepreload" href="js/ttm.js">
  <link rel="modulepreload" href="js/search.js">
  <link rel="modulepreload" href="js/index-data.js">
  <link rel="modulepreload" href="js/vision.js">
  <link rel="modulepreload" href="js/screens/identify.js">
  <!-- pdf.js (the reader) and three.js (the 3D viewer) are imported from these two the moment a
       manual or a Pick screen opens. The handshake can happen now instead. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="css/counter.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/particons.css">
  <!-- Six sheets for five screens nobody can reach from the landing: 60 KB of render-blocking
       CSS in front of a search field that uses none of it. media="print" drops them to a lower
       priority and applies them on load - one frame after the first paint, seconds before
       anything they style is on screen. Identify's own sheet, counter, themes and particons
       stay blocking. -->
  <link rel="stylesheet" media="print" onload="this.media='all'" href="css/viewer3d.css">
  <link rel="stylesheet" href="css/screens/identify.css">
  <link rel="stylesheet" media="print" onload="this.media='all'" href="css/screens/confirm.css">
  <link rel="stylesheet" media="print" onload="this.media='all'" href="css/screens/pick.css">
  <link rel="stylesheet" media="print" onload="this.media='all'" href="css/screens/book.css">
  <link rel="stylesheet" media="print" onload="this.media='all'" href="css/screens/invoice.css">
  <link rel="stylesheet" media="print" onload="this.media='all'" href="css/screens/cost.css">
  <link rel="stylesheet" media="print" onload="this.media='all'" href="css/climate.css">
  <!-- The saved theme, before the first paint. js/theme.js is a module and therefore deferred,
       so leaving this to it would show one frame of Workshop to someone who chose Night. -->
  <script>
    (function () {
      var ids = ["workshop", "night", "blueprint", "track", "paper"];
      var colors = { workshop: "#e85d04", night: "#ff7a1f", blueprint: "#3fd0f7", track: "#ffd100", paper: "#cc0000" };
      var id = null;
      try { id = localStorage.getItem("mechanica.theme"); } catch (e) { id = null; }
      if (ids.indexOf(id) < 0) {
        id = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "workshop";
      }
      document.documentElement.setAttribute("data-theme", id);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta && colors[id]) meta.setAttribute("content", colors[id]);
    })();
  </script>
</head>
<body>
  <header class="ticket">
    <button type="button" class="ticket-back is-off" data-back aria-label="Back">←</button>
    <span>Mechanica</span>
    <button type="button" class="ticket-theme" data-theme-button aria-label="Theme"><i></i></button>
  </header>
  <ol class="rail">
    <li data-step="identify" class="now" aria-current="step"><b>1</b><span>Identify</span></li>
    <li data-step="confirm"><b>2</b><span>Confirm</span></li>
    <li data-step="pick"><b>3</b><span>Pick</span></li>
    <li data-step="book"><b>4</b><span>Book</span></li>
  </ol>
  <main>
    <section data-screen="identify" hidden><div data-root></div></section>
    <section data-screen="confirm" hidden><div data-root></div></section>
    <section data-screen="pick" hidden><div data-root></div></section>
    <section data-screen="book" hidden><div data-root></div></section>
  </main>
  <aside class="ov pv" data-overlay="invoice" hidden>
    <div class="ov-sheet pv-sheet" role="dialog" aria-modal="true" aria-label="Parts" data-root></div>
  </aside>
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
