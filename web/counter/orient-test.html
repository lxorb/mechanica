<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orientation sweep — dev</title>
  <!--
    Dev harness. `node web/tools/viewer-shots.mjs --orient` screenshots this page to decide the
    `orient` value each generic model needs in web/tools/model-shortlist.json.

    Four mounts of the same model, at 0 / 90 / 180 / 270 degrees, labelled. Pick the panel where
    the vehicle faces right (its nose at +x, three-quarters towards the camera) — that is the
    number. It cannot be computed: from above, the front and the back of a motorcycle are the
    same silhouette. Not linked from index.html and not part of the flow.
  -->
  <link rel="stylesheet" href="css/viewer3d.css">
  <script type="importmap">
  {"imports":{
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }}
  </script>
  <style>
    body { margin: 0; background: #14110f; font: 700 12px/1 system-ui, sans-serif; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
    .cell { position: relative; }
    .cell .viewer3d { aspect-ratio: 1 / 1; border-width: 2px; }
    .cell b { position: absolute; z-index: 5; top: 4px; left: 4px; padding: 3px 6px;
      background: #e85d04; color: #fff; letter-spacing: .08em; }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script type="module">
    import { mount, registerGenericParts } from "./js/viewer3d.js";

    const key = new URLSearchParams(location.search).get("model") || "generic/scooter";
    const name = key.replace(/^generic\//, "");
    window.orientReady = 0;

    // re-register the model with each candidate angle in turn; mount() reads orientFor() at load
    for (const degrees of [0, 90, 180, 270]) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const label = document.createElement("b");
      label.textContent = `${degrees}°`;
      const host = document.createElement("div");
      cell.append(label, host);
      document.getElementById("grid").append(cell);

      registerGenericParts({ [name]: { kind: "bike", orient: degrees, extra: {} } });
      await new Promise((done) => {
        mount(host, key, {
          environment: false,
          onUpgrade: () => { window.orientReady += 1; done(); },
          onError: () => { window.orientReady += 1; done(); },
        });
      });
    }
  </script>
</body>
</html>
