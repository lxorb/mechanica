<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Viewer 3D — dev</title>
  <!-- dev harness for js/viewer3d.js. Not part of the flow, not linked from index.html. -->
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;800&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/counter.css">
  <link rel="stylesheet" href="css/viewer3d.css">
  <script type="importmap">
  {"imports":{
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }}
  </script>
  <style>
    body { padding: 0; }
    .wrap { display: flex; flex-direction: column; gap: 8px; padding: 8px; max-width: 900px; margin: 0 auto; }
    .viewer3d { aspect-ratio: 1 / 1; }
    @media (min-width: 700px) { .viewer3d { aspect-ratio: 16 / 9; } }
    .row { display: flex; gap: 0; border: 3px solid var(--ink); }
    select { flex: 1; min-height: 44px; border: 0; background: var(--card); color: var(--ink);
      font-family: "Big Shoulders Display", sans-serif; font-weight: 800; font-size: 1rem;
      letter-spacing: .06em; text-transform: uppercase; padding: 0 8px; appearance: none; }
    .out { font-family: Barlow, sans-serif; font-size: .8rem; line-height: 1.5; background: var(--card);
      border: 3px solid var(--ink); padding: 6px 8px; white-space: pre-wrap; word-break: break-word; }
    .out b { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header class="ticket"><span>Viewer 3D</span><b data-ticket id="fps">– fps</b></header>
  <div class="wrap">
    <div class="row">
      <!-- exact models first, then one entry per bike the generics have to stand in for;
           the generic list is filled in from store/models/generic/parts.json at boot -->
      <select id="model">
        <option value="yzf-2021">yzf-2021</option>
        <option value="honda-cbr650r">honda-cbr650r</option>
        <option value="corvette-c8">corvette-c8</option>
      </select>
      <select id="bike">
        <option value="">— pick a bike —</option>
      </select>
    </div>
    <div id="host"></div>
    <div class="viewer3d-bar">
      <button type="button" class="viewer3d-btn" id="explode" aria-pressed="false">Explode</button>
      <button type="button" class="viewer3d-btn" id="highlight">Front brake</button>
      <button type="button" class="viewer3d-btn" id="focus">Focus chain</button>
      <button type="button" class="viewer3d-btn" id="xray" aria-pressed="false">X-ray</button>
      <button type="button" class="viewer3d-btn" id="reset">Reset</button>
    </div>
    <div class="out" id="out">booting…</div>
  </div>

  <script type="module">
    import { mount, modelFor, partFor, PART_KEYS, typesReady } from "./js/viewer3d.js";

    const host = document.getElementById("host");
    const out = document.getElementById("out");
    const fpsEl = document.getElementById("fps");
    const errors = [];
    window.addEventListener("error", (e) => errors.push(String(e.message)));
    window.addEventListener("unhandledrejection", (e) => errors.push(String(e.reason)));

    let viewer = null;
    let started = 0;
    let readyAt = 0;
    let upgradedAt = 0;
    let loaded = 0;
    // ?src=gltf loads the uncompressed Sketchfab source instead of model.glb (dev only)
    const src = new URLSearchParams(location.search).get("src");
    // ?env=<polyhaven name> picks the HDRI, ?env=off drops back to the transparent studio look
    const envParam = new URLSearchParams(location.search).get("env");

    function log(extra = "") {
      const state = viewer ? viewer.state() : {};
      const d = window.lastDescriptor;
      out.textContent =
        `model ${state.model || "-"} · ${state.empty ? "no model" : "glb"} · scene ${readyAt ? readyAt + " ms" : "…"} · glb ${upgradedAt ? upgradedAt + " ms" : "…"} · dl ${loaded ? Math.round(loaded * 100) + "%" : "…"}\n` +
        (d ? `${d.label} → ${d.key} · ${d.exact ? "exact" : "generic"} · type ${d.type} · tint ${d.tint || "none"}\n` : "") +
        `meshes ${state.meshes ?? "-"} · part ${state.part || "none"} · spacing ${(state.spacing ?? 0).toFixed(2)}\n` +
        `groups ${(state.parts || []).join(" ")}\n` +
        `errors ${errors.length ? errors.join(" | ") : "none"}${extra ? "\n" + extra : ""}`;
    }

    function start(key) {
      if (viewer) viewer.dispose();
      errors.length = 0;
      readyAt = 0;
      upgradedAt = 0;
      loaded = 0;
      started = performance.now();
      const plainKey = typeof key === "string" ? key : key.key;
      viewer = mount(host, key, {
        debug: true,
        url: src ? (src === "gltf" ? `../store/models/${plainKey}/scene.gltf` : `../store/models/${plainKey}/_${src}.glb`) : undefined,
        environment: envParam === "off" ? false : envParam || undefined,
        onReady: () => { readyAt = Math.round(performance.now() - started); log(); },
        onUpgrade: () => { upgradedAt = Math.round(performance.now() - started); log(); },
        onProgress: (fraction) => { loaded = fraction; },
        onSelect: (part) => log(`clicked ${part || "nothing"}`),
        onError: (error) => { errors.push(String(error && error.message || error)); log(); },
      });
      window.viewer = viewer;
      window.lastDescriptor = typeof key === "string" ? null : key;
      log();
    }

    document.getElementById("model").addEventListener("change", (e) => {
      document.getElementById("bike").value = "";
      start(e.target.value);
    });

    /**
     * The bike list is the real path: modelFor(bike) picks the exact model or the generic for its
     * type and carries the tint, and mount() takes that descriptor whole. These are the bikes the
     * generics actually have to stand in for, one per type plus the three exact models.
     */
    const BIKES = [
      { make: "KTM", model: "390 Duke", year: 2024 },
      { make: "Yamaha", model: "YZF-R7", year: 2023 },
      { make: "Honda", model: "CBR650R", year: 2024 },
      { make: "KTM", model: "450 SX-F", year: 2024 },
      { make: "KTM", model: "500 EXC-F", year: 2024 },
      { make: "KTM", model: "690 SMC R", year: 2023 },
      { make: "Vespa", model: "Primavera 150", year: 2024 },
      { make: "Honda", model: "Gold Wing", year: 2023 },
      { make: "BMW", model: "R 1250 GS", year: 2023 },
      { make: "Harley-Davidson", model: "Softail Standard", year: 2022 },
      { make: "Royal Enfield", model: "Classic 350", year: 2024 },
      { make: "Honda", model: "Grom", year: 2024 },
      { make: "GasGas", model: "TXT Racing 300", year: 2023 },
      { make: "Chevrolet", model: "Corvette Stingray", year: 2021 },
    ];

    const bikeSelect = document.getElementById("bike");
    for (const [i, bike] of BIKES.entries()) {
      const option = document.createElement("option");
      option.value = String(i);
      option.textContent = `${bike.make} ${bike.model}`;
      bikeSelect.append(option);
    }
    bikeSelect.addEventListener("change", (e) => {
      if (!e.target.value) return;
      start(modelFor(BIKES[Number(e.target.value)]));
    });
    document.getElementById("explode").addEventListener("click", (e) => {
      const on = e.target.getAttribute("aria-pressed") !== "true";
      e.target.setAttribute("aria-pressed", String(on));
      viewer.explode(on, 1);
      log();
    });
    document.getElementById("highlight").addEventListener("click", () => { viewer.highlight("front-brake"); log(); });
    document.getElementById("focus").addEventListener("click", () => { viewer.focus("chain"); log(); });
    document.getElementById("xray").addEventListener("click", (e) => {
      const on = e.target.getAttribute("aria-pressed") !== "true";
      e.target.setAttribute("aria-pressed", String(on));
      viewer.xray(on);
    });
    document.getElementById("reset").addEventListener("click", () => {
      viewer.reset();
      document.getElementById("explode").setAttribute("aria-pressed", "false");
      document.getElementById("xray").setAttribute("aria-pressed", "false");
      log();
    });

    // fps, measured over one-second windows so it is readable from a screenshot
    let frames = 0;
    let since = performance.now();
    window.fpsSamples = [];
    (function tick(now) {
      frames += 1;
      if (now - since >= 1000) {
        const fps = Math.round((frames * 1000) / (now - since));
        window.fpsSamples.push(fps);
        fpsEl.textContent = `${fps} fps`;
        frames = 0;
        since = now;
      }
      requestAnimationFrame(tick);
    })(performance.now());

    // a couple of mapping sanity checks, printed once
    window.mapping = {
      model: BIKES.map((b) => { const d = modelFor(b); return `${b.make} ${b.model} -> ${d.key}${d.tint ? " " + d.tint : ""}`; }),
      part: ["Checking the front brake fluid level", "Drive chain slack", "Tyre pressure", "Engine oil change", "Replacing a fuse", "Mirrors"].map((t) => `${t} -> ${partFor(t)}`),
      keys: PART_KEYS.length,
    };

    // ?model=<key> or ?bike=<index> so a headless run can open one straight away
    const params = new URLSearchParams(location.search);
    typesReady.then(() => {
      window.mapping.model = BIKES.map((b) => { const d = modelFor(b); return `${b.make} ${b.model} -> ${d.key}${d.tint ? " " + d.tint : ""}`; });
      window.typesReady = true;
      if (params.get("bike")) {
        const i = BIKES.findIndex((b) => `${b.make} ${b.model}`.toLowerCase().includes(params.get("bike").toLowerCase()));
        if (i >= 0) { bikeSelect.value = String(i); start(modelFor(BIKES[i])); return; }
      }
      if (params.get("model")) { start(params.get("model")); return; }
      if (!viewer) start("yzf-2021");
    });
    if (!params.get("bike") && !params.get("model")) start("yzf-2021");
  </script>
</body>
</html>
